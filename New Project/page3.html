<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members Lounge | Video Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-card">
      <header class="hero">
        <p class="eyebrow">Members Only</p>
        <h1>Video Preview</h1>
        <p class="hero-subtitle">
          Press play for a short teaser. The full catalog unlocks once you’re signed in.
        </p>
      </header>

      <main>
        <section class="content-section">
          <h2>Featured Clip</h2>
          <p>
            This trailer sets the tone and pace of the experience, giving you a glimpse
            of the production quality inside the lounge.
          </p>
        </section>

        <section class="media-card">
          <figure class="video-figure">
            <div class="video-wrapper">
              <iframe
                src="https://www.youtube.com/embed/9OBK8KS8Ims?si=1mPZHX2UoLb9ZXl6"
                title="Members Lounge teaser"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>
            <figcaption>
              Stream a teaser before you dive into the full members-only library.
            </figcaption>
          </figure>
        </section>

        <nav class="nav-buttons" aria-label="Page navigation">
          <a class="btn secondary" href="page2.html">⬅ Back</a>
          <a class="btn" href="index.html">Return Home</a>
        </nav>
      </main>
    </div>
  </body>
</html>
